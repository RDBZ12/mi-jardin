<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2e6f40" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mi Jardín" />
    <meta name="format-detection" content="telephone=no" />
    <title>Mi Jardín | Tu espacio para crecer</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="/src/css/main.css" />
    <script>
      try {
        const raiz = document.documentElement;
        const tema = localStorage.getItem('mi-jardin-theme-preference') || 'light';
        if (tema === 'dark' || (tema === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) raiz.dataset.theme = 'dark';
        const usuario = localStorage.getItem('mi_jardin_usuario_offline');
        const rutas = ['inicio', 'plantas', 'riego', 'identificar', 'historial', 'recordatorios', 'menu'];
        const ruta = localStorage.getItem('mi-jardin-vista-activa');
        if (usuario) {
          raiz.classList.add('has-saved-user');
          if (rutas.includes(ruta)) raiz.dataset.vistaInicial = ruta;
          const subvista = localStorage.getItem('mi-jardin-menu-subvista');
          if (['sub-perfil', 'sub-perfil-apariencia', 'sub-perfil-cuenta', 'sub-perfil-respaldo', 'sub-sonidos', 'sub-sincronizacion', 'sub-idioma'].includes(subvista)) raiz.dataset.subvistaInicial = subvista;
        }
      } catch { /* Storage can be unavailable in private browsing. */ }
    </script>
  </head>
  <body>
    <main class="layout" id="vista-auth"></main>
    <section class="app-view oculto" id="vista-app" aria-label="Mi jardín">
      <nav class="app-nav" aria-label="Secciones de Mi Jardín">
        <div class="sidebar-brand">
          <span class="brand-mark" aria-hidden="true">m</span>
          <span><strong>MI JARDÍN</strong><small>Tu compañero botánico</small></span>
        </div>
        <button class="nav-item activo" type="button" data-ruta="inicio" data-vista="inicio" aria-current="page"><span class="nav-icon icon-home" aria-hidden="true"></span><span>Inicio</span></button>
        <button class="nav-item" type="button" data-ruta="plantas" data-vista="plantas"><span class="nav-icon icon-plants" aria-hidden="true"></span><span>Mis plantas</span></button>
        <button class="nav-item" type="button" data-ruta="riego" data-vista="riego"><span class="nav-icon icon-water" aria-hidden="true"></span><span>Riego</span></button>
        <button class="nav-item" type="button" data-ruta="recordatorios" data-vista="recordatorios"><span class="nav-icon icon-history" aria-hidden="true"></span><span>Recordatorios</span></button>
        <button class="nav-item" type="button" data-ruta="menu" data-vista="menu"><span class="nav-icon icon-profile" aria-hidden="true"></span><span data-i18n="menu_titulo">Menú</span></button>
        <span class="connection-status" id="connection-status" role="status" aria-live="polite">En línea</span>
      </nav>
      <main class="app-main" id="contenedor-vistas"></main>
      
    </section>
    <script type="module" src="/src/js/app.js"></script>
    <script type="module" src="/src/js/pwa.js"></script>
  </body>
</html>
